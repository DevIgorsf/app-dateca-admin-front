<header class="navbar default-layout-navbar p-0 fixed-top d-flex flex-row"
  [ngClass]="{ 'navbar--sidebar-expanded': sidebarExpanded, 'navbar--sidebar-collapsed': !sidebarExpanded }">
  <button class="navbar__icon-button navbar__sidebar-toggle" type="button" (click)="toggleSidebar()"
    aria-label="Alternar menu lateral">
    <i class="bi bi-list"></i>
  </button>

  <div class="navbar__actions">
    <button
      type="button"
      class="navbar__icon-button navbar__theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-pressed]="isDarkMode() === 'dark'"
      [attr.aria-label]="isDarkMode() === 'dark' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'"
      [title]="isDarkMode() === 'dark' ? 'Tema claro' : 'Tema escuro'">
      <i class="bi" [class.bi-sun-fill]="isDarkMode() === 'dark'" [class.bi-moon-stars-fill]="isDarkMode() === 'light'"></i>
    </button>

    <nav class="navbar__navegacao">
      @if (user$ | async; as user) {
        <div class="dropdown">
          <button class="navbar__profile" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            <span class="navbar__profile-name">{{ getFirstName(professor?.name) }}</span>
            <i class="bi bi-chevron-down navbar__profile-caret"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="navbar-list__item">
              <a class="dropdown-item" routerLink="/admin/perfil">
                <span class="navbar-list__icon">
                  <i class="bi bi-person"></i>
                </span>
                <span class="ms-2">Perfil</span>
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li class="navbar-list__item">
              <a class="dropdown-item navbar-list__item--danger" (click)="logout()">
                <span class="navbar-list__icon">
                  <i class="bi bi-box-arrow-right"></i>
                </span>
                <span class="ms-2">Logout</span>
              </a>
            </li>
          </ul>
        </div>
      }
    </nav>
  </div>
</header>
