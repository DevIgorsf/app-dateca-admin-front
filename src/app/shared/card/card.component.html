<mat-card class="dashboard-card" [ngClass]="'dashboard-card--' + accent">
  <mat-card-content class="dashboard-card__content">
    <div class="dashboard-card__text">
      <p class="dashboard-card__title">{{ title }}</p>
      <p class="dashboard-card__value">{{ conteudo }}</p>
    </div>
    <span class="dashboard-card__icon">
      <i class="{{ icon }}"></i>
    </span>
  </mat-card-content>
</mat-card>
