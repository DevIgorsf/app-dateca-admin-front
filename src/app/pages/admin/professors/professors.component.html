
<div class="professor">
  <div class="app-page__toolbar">
    <div>
      <h1 class="app-page__title">Professores</h1>
      <p class="app-page__subtitle">Professores com acesso ao painel administrativo.</p>
    </div>
    <a class="btn btn-primary" routerLink="adicionar-professor">
      <i class="bi bi-person-plus-fill me-2"></i>Novo professor
    </a>
  </div>

<div class="mat-elevation-z8">
  <table class="mat-elevation-z8" mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">

    <ng-container matColumnDef="registrationNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Registro </th>
      <td mat-cell *matCellDef="let element"> {{ element.registrationNumber }} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
      sortActionDescription="Ordenar por nome">
        Nome
      </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> Ações</th>
      <td mat-cell *matCellDef="let element">
        <a routerLink="editar-professor/{{element.id}}">
          <i class="bi bi-pencil-square text-success mx-2"></i>
        </a>
        <i (click)="deleteProfessor(element.id)" class="bi bi-trash-fill text-danger mx-2"></i>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator
    [pageSize]="5"
    showFirstLastButtons
    aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
