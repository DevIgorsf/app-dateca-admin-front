<div class="login__background">
  <button
    type="button"
    class="login__theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="isDarkMode() === 'dark' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'"
    [title]="isDarkMode() === 'dark' ? 'Tema claro' : 'Tema escuro'">
    <i class="bi" [class.bi-sun-fill]="isDarkMode() === 'dark'" [class.bi-moon-stars-fill]="isDarkMode() === 'light'"></i>
  </button>

  <section class="login">
    <aside class="login__brand">
      <img class="login__img" src="assets/images/logo-dateca-background-white.jpg" alt="Logo da Dateca" />
    </aside>

    <form class="login__form" (ngSubmit)="logIn()" #loginForm="ngForm">
      <h1 class="login__title">Faça o seu login</h1>
      <p class="login__subtitle">Acesse o painel administrativo da Dateca.</p>

      <div class="login__field">
        <label class="login-label" for="login">Login</label>
        <input
          id="login"
          class="form-item"
          placeholder="Login do usuário"
          [(ngModel)]="login"
          name="login"
          #campoUsuario="ngModel"
          [class.input-invalido]="campoUsuario.invalid && campoUsuario.touched"
          required
          />
        @if (campoUsuario.invalid && campoUsuario.touched) {
          <app-message mensagem="Usuário obrigatório"></app-message>
        }
      </div>

      <div class="login__field">
        <label class="login-label" for="password">Senha</label>
        <input
          id="password"
          type="password"
          class="form-item"
          placeholder="Senha"
          [(ngModel)]="password"
          name="password"
          #campoSenha="ngModel"
          [class.input-invalido]="campoSenha.invalid && campoSenha.touched"
          required
          />
        @if (campoSenha.invalid && campoSenha.touched) {
          <app-message mensagem="Senha obrigatória"></app-message>
        }
      </div>

      <button
        type="submit"
        class="button-adicionar login-button"
        [ngClass]="{ 'botao-desabilitado': loginForm.invalid }"
        [disabled]="loginForm.invalid">
        Entrar
      </button>
    </form>
  </section>
</div>
