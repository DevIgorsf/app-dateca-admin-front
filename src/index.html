<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Dateca Professor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Aplica o tema antes da primeira pintura. Sem isto a página aparece no
    // tema claro por um instante e "pisca" ao escuro quando o Angular sobe.
    // A mesma chave e a mesma lógica ficam em ThemeService.
    (function () {
      try {
        var saved = localStorage.getItem('dateca-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
</head>
<body class="mat-typography">
  <!-- O CSS e o JS do Bootstrap são empacotados pelo build (ver angular.json).
       Antes o CSS vinha de um <link> para a CDN na versão 5.3.0-alpha3 enquanto
       o styles.scss compilava a 5.3.2 do node_modules — duas cópias diferentes
       do mesmo framework disputando as mesmas regras. -->
  <app-root></app-root>
</body>
</html>
